name: "Terraform CI/CD Pipeline"
# 1. 트리거 조건 설정: 어떤 이벤트에서 워커플로우를 실행할지 지정
on:
  push:
    branches:
      - main
  pull:
    branches:
      - main
    #     paths: # 배포 기준이 될 파일이 있는 위치(변경된 파일 기준)
    #       - 'infra/project/**'
    # pull_request:
    #   branches: [main]
    #   paths:
    #     - 'infra/project/**'
    #     - 'project/**'

# 2. 권한 설정 (OpenID Connect 또는 시크릿 접근 권한)
permissions:
  contents: read

jobs:
  terraform:
    # 3. 전체 작업에 대한 서버 구성 및 배포 설정 파일의 위치 
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/project # 이게 중요하다. 
    steps:
      # 3-1. 소스 코드 체크아웃 (체크아웃: 저장소의 파일을 러너로 다운로드)
      - name: Checkout Repository
        uses: actions/checkout@v4
      # 3-2. Terraform CLI 도구 설치
      - name: Setup Terrform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.x
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com  # AWS접속에 사용될 토큰 발급 대상 지정
          output-env-credentials: true # 깃허브 액션의 환경 변수 자동 저장

      
      # 3-4 테라폼 초기화 (provider 다운로드)
      - name: Terraform Init
        run: terraform init

      # 3-5. 테라폼 코드 포맷 검증
      - name: Terraform Validate
        run: terraform validate
      
      # 3-6. 변경 사항 미리보기(Plan)
      - name: Terraform Plan
        run: terraform plan-no-color # 브라우저 출력시 색코드로 인한 글짜 깨짐 방지
        continue-on-error: false # Error 발생시 계속 진행(true), 종료(false)


      # 컬러를 포함할 경우 색상코드를 텍스트로 표현해 깨져서 출력 되는것을 방지
      # 3-7. 인프라 반영 (apply) or main 브랜치에 푸시(Merge)될 때만 실행
      - name: Terraform Apply & Destroy
        run: terraform apply --auto-approve

# 4. Terraform CLI 도구 설치

# 5. AWS 인증 정보(Github secrets 활용)

# 6. 테라폼 초기화 (Provider 다운로드 및 backend 설정)

# 7. 테라폼 코드 포맷 검증

# 8. 변경 사항 미리 보기 (Plan)

# 9. 인프라 반영 (apply/destroy)